<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTPASS — ปลดล็อกแอปพรีเมียม ราคาเบาๆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF9FF;
    --bg-deep:#F3EEFF;
    --surface:#FFFFFF;
    --line:#E7DFFB;
    --text:#221A3D;
    --text-dim:#766C93;
    --purple:#8B5CF6;
    --purple-deep:#7C3AED;
    --pink:#EC4899;
    --blue:#3B82F6;
    --coral:#FF6B4A;
    --success:#10B981;
    --warn:#F59E0B;
    --danger:#EF4444;
    --radius:14px;
    --mono:'IBM Plex Mono', monospace;
    --grad: linear-gradient(120deg, var(--purple), var(--pink) 55%, var(--blue));
    --grad-soft: linear-gradient(120deg, #F3E6FF 0%, #FCE0F1 45%, #DCEBFF 100%);
    --grad-cta: linear-gradient(120deg, #F536A0, #D6127A);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans Thai', sans-serif; font-weight:300; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, select, textarea{ font-family:inherit; }
  ul{ list-style:none; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ===== Logo mark ===== */
  .logo-mark{
    width:32px; height:32px; border-radius:10px; flex-shrink:0;
    background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff; font-size:14px;
    box-shadow:0 6px 16px -6px rgba(139,92,246,.6);
  }
  .logo-mark-img{ object-fit:cover; background:var(--surface); box-shadow:none; border:1px solid var(--line); }

  /* ===== Header ===== */
  #siteHeader{ position:sticky; top:0; z-index:40; background:rgba(251,249,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; gap:18px; height:68px; }
  .brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .brand-text{ font-size:18px; font-weight:700; }
  .brand-text span{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav.main-nav{ display:flex; gap:26px; flex-shrink:0; }
  nav.main-nav a{ font-size:13.5px; font-weight:600; color:var(--text-dim); transition:color .2s; }
  nav.main-nav a:hover{ color:var(--purple-deep); }
  .header-search{ flex:1; max-width:340px; position:relative; }
  .header-search input{
    width:100%; border:1px solid var(--line); border-radius:999px; padding:9px 16px 9px 34px;
    font-size:13px; background:var(--surface); color:var(--text);
  }
  .header-search input:focus{ border-color:var(--purple); outline:none; }
  .header-search .si{ position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-dim); }
  .admin-search-bar{ position:relative; max-width:480px; margin-bottom:18px; }
  .admin-search-bar input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 16px 11px 36px;
    font-size:13px; background:var(--surface); color:var(--text);
  }
  .admin-search-bar input:focus{ border-color:var(--purple); outline:none; }
  .admin-search-bar .si{ position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-dim); }
  .header-actions{ display:flex; align-items:center; gap:10px; margin-left:auto; flex-shrink:0; }
  .admin-link{ font-size:12px; color:var(--text-dim); font-weight:600; border:1px solid var(--line); padding:8px 12px; border-radius:999px; transition:border-color .2s; }
  .admin-link:hover{ border-color:var(--purple); }
  .cart-btn{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; border:1px solid var(--line); padding:9px 15px; border-radius:999px; transition:border-color .2s, background .2s; }
  .cart-btn:hover{ border-color:var(--purple); background:rgba(139,92,246,.06); }
  .cart-count{ background:var(--grad-cta); color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  /* ===== Hero / Banner ===== */
  .hero{ position:relative; overflow:hidden; background:var(--grad-soft); color:var(--text); padding:56px 0 40px; }
  .hero-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; background:rgba(255,255,255,.7); color:var(--purple-deep); border:1px solid rgba(124,58,237,.25); padding:7px 15px; border-radius:999px; margin-bottom:20px; }
  .hero h1{ font-size:clamp(30px,4.6vw,46px); line-height:1.2; max-width:640px; }
  .hero p{ max-width:480px; margin-top:16px; font-size:14.5px; color:var(--text-dim); }
  .hero-cta{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }
  .btn-white{ background:var(--grad-cta); color:#fff; padding:13px 26px; font-size:13.5px; font-weight:700; border-radius:999px; transition:transform .2s; display:inline-block; }
  .btn-white:hover{ transform:translateY(-1px); }
  .btn-outline-white{ border:1.5px solid rgba(124,58,237,.35); color:var(--purple-deep); background:rgba(255,255,255,.6); padding:13px 24px; font-size:13.5px; font-weight:600; border-radius:999px; }

  .highlights{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:36px; }
  .h-card{
    background:#fff; border:1px solid var(--line); box-shadow:0 6px 18px -10px rgba(124,58,237,.25);
    border-radius:var(--radius); padding:16px;
  }
  .h-card .hi{ font-size:20px; margin-bottom:8px; display:block; }
  .h-card .ht{ font-size:12.5px; font-weight:700; color:var(--text); }
  .h-card .hs{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  /* ===== Category + Search section ===== */
  .store-stats-section{ padding:34px 0 6px; }
  .store-stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .store-stat-card{
    position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:20px 22px; min-height:118px;
  }
  .store-stat-label{ font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:10px; }
  .store-stat-value{ font-family:var(--mono); font-size:30px; font-weight:700; color:var(--text); line-height:1; }
  .store-stat-sub{ font-size:12px; color:var(--text-dim); margin-top:6px; }
  .store-stat-icon{ position:absolute; right:14px; top:50%; transform:translateY(-50%); width:56px; height:56px; opacity:.14; background-size:contain; background-repeat:no-repeat; background-position:center; }
  .stat-icon-users{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238B5CF6'><circle cx='8' cy='8' r='3'/><circle cx='16' cy='8' r='3'/><path d='M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/><path d='M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/></svg>"); }
  .stat-icon-products{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2'><path d='M12 3l9 5v8l-9 5-9-5V8z'/><path d='M3 8l9 5 9-5'/><path d='M12 13v8'/></svg>"); }
  .stat-icon-stock{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2'><rect x='3' y='7' width='18' height='13' rx='2'/><path d='M3 11h18'/><path d='M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2'/></svg>"); }
  .stat-icon-sold{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M8 12l3 3 5-6'/></svg>"); }

  .cat-section{ padding:34px 0 4px; }
  .cat-search-bar{ display:flex; gap:10px; margin-bottom:18px; }
  .cat-search-bar input{
    flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 20px;
    font-size:13.5px; background:var(--surface);
  }
  .cat-search-bar input:focus{ border-color:var(--purple); outline:none; }
  .chips{ display:flex; gap:9px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--line); padding:9px 17px; font-size:13px; font-weight:600; border-radius:999px; background:var(--surface); color:var(--text-dim); transition:all .2s; }
  .chip:hover{ border-color:var(--purple); color:var(--text); }
  .chip.active{ background:var(--grad-cta); color:#fff; border-color:transparent; }

  /* ===== Section headers ===== */
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; margin:34px 0 18px; }
  .section-head h2{ font-size:21px; }
  .section-count{ font-size:12.5px; color:var(--text-dim); }

  /* ===== Best seller strip ===== */
  .bs-scroll{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
  .bs-card{
    min-width:190px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; flex-shrink:0; cursor:pointer; transition:border-color .2s, transform .2s;
  }
  .bs-card:hover{ border-color:var(--purple); transform:translateY(-2px); }
  .bs-badge{ display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--coral); padding:3px 8px; border-radius:999px; margin-bottom:8px; }

  /* ===== Product grid & cards ===== */
  .products-section{ padding:8px 0 80px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer;
    transition:border-color .25s, transform .25s, box-shadow .25s;
  }
  .card:hover{ border-color:var(--purple); transform:translateY(-3px); box-shadow:0 16px 32px -22px rgba(139,92,246,.5); }
  .card-top{ display:flex; align-items:center; gap:11px; }
  .badge{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; flex-shrink:0; }
  .badge-netflix{ background:rgba(224,72,62,.13); color:#E0483E; }
  .badge-spotify{ background:rgba(61,163,93,.13); color:#3DA35D; }
  .badge-youtube{ background:rgba(224,72,62,.13); color:#E0483E; }
  .badge-gpt{ background:rgba(139,92,246,.13); color:#8B5CF6; }
  .badge-canva{ background:rgba(236,72,153,.13); color:#EC4899; }
  .badge-capcut{ background:rgba(59,130,246,.13); color:#3B82F6; }
  .badge-vpn{ background:rgba(234,179,8,.15); color:#CA8A04; }
  .badge-ch3{ background:rgba(249,115,22,.13); color:#F97316; }
  .badge-oned{ background:rgba(59,130,246,.13); color:#3B82F6; }
  .badge-viu{ background:rgba(168,85,247,.13); color:#A855F7; }
  .badge-wetv{ background:rgba(34,197,94,.13); color:#16A34A; }
  .badge-prime{ background:rgba(0,168,225,.13); color:#00A8E1; }
  .badge-youku{ background:rgba(220,38,38,.13); color:#DC2626; }
  .badge-bili{ background:rgba(251,114,153,.15); color:#FB7299; }
  .badge-outlook{ background:rgba(0,120,212,.13); color:#0078D4; }
  .badge-hotmail{ background:rgba(0,80,158,.13); color:#00509E; }
  .badge-img{ background-size:cover; background-position:center; background-color:var(--bg-deep); }
  .card-name{ font-size:14.5px; font-weight:700; }
  .card-desc{ font-size:11.5px; color:var(--text-dim); min-height:30px; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .card-price{ font-family:var(--mono); font-size:15.5px; font-weight:600; color:var(--purple-deep); }
  .card-price small{ font-family:'Noto Sans Thai',sans-serif; font-size:10.5px; color:var(--text-dim); font-weight:400; }
  .agent-price{ color:var(--coral); font-weight:700; }
  .orig-price{ font-size:11px; color:var(--text-dim); text-decoration:line-through; font-weight:400; }
  .agent-status-box{ background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:14px 0; }
  .agent-status-title{ font-weight:700; font-size:14px; }
  .agent-status-desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .agent-status-pending{ background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.3); }
  .agent-status-approved{ background:rgba(139,92,246,.08); border-color:rgba(139,92,246,.3); }
  .order-history-list{ max-height:52vh; overflow-y:auto; margin-top:8px; display:flex; flex-direction:column; gap:10px; }
  .order-history-item{ background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .ohi-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .ohi-id{ font-family:var(--mono); font-weight:700; font-size:12.5px; }
  .ohi-date{ font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .ohi-items{ font-size:12px; color:var(--text); margin-bottom:8px; }
  .ohi-bottom{ display:flex; justify-content:space-between; align-items:center; }
  .ohi-total{ font-family:var(--mono); font-weight:700; color:var(--purple-deep); font-size:13.5px; }
  .order-history-empty{ text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px; }
  .agent-banner{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    background:linear-gradient(120deg, rgba(139,92,246,.1), rgba(236,72,153,.08));
    border:1px solid rgba(139,92,246,.25); border-radius:var(--radius); padding:20px 26px; margin-top:24px;
  }
  .agent-banner-title{ font-weight:700; font-size:15px; }
  .agent-banner-desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; max-width:480px; }
  .wallet-btn{ font-size:12px; font-weight:700; color:var(--purple-deep); background:rgba(139,92,246,.1); border:1px solid rgba(139,92,246,.3); padding:8px 12px; border-radius:999px; transition:background .2s; }
  .wallet-btn:hover{ background:rgba(139,92,246,.18); }
  .wallet-balance{ color:var(--purple-deep); font-family:var(--mono); font-weight:700; }
  .topup-amounts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .topup-amount-btn{ border:1.5px solid var(--line); border-radius:10px; padding:12px 6px; font-size:13px; font-weight:700; text-align:center; transition:all .2s; }
  .topup-amount-btn.selected{ border-color:var(--purple); background:rgba(139,92,246,.06); color:var(--purple-deep); }
  .wallet-summary-box{ background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .wallet-summary-label{ font-size:12.5px; color:var(--text-dim); }
  .wallet-summary-value{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--purple-deep); }
  .stock-tag{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .stock-ok{ background:rgba(16,185,129,.12); color:#0B9D6E; }
  .stock-low{ background:rgba(245,158,11,.14); color:#B4790A; }
  .stock-out{ background:rgba(239,68,68,.12); color:#DC2626; }

  /* ===== Product detail view ===== */
  .pd-wrap{ padding:30px 0 90px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:20px; }
  .back-link:hover{ color:var(--purple-deep); }
  .pd-grid{ display:grid; grid-template-columns:.85fr 1.15fr; gap:44px; align-items:flex-start; }
  .pd-media{
    aspect-ratio:1/1; border-radius:20px; background:var(--grad);
    display:flex; align-items:center; justify-content:center; font-size:64px; color:#fff; font-weight:700;
    font-family:'Space Grotesk',sans-serif;
  }
  .pd-tag{ font-size:12px; font-weight:700; color:var(--purple-deep); text-transform:uppercase; letter-spacing:.05em; }
  .pd-title{ font-size:28px; margin-top:8px; }
  .pd-desc{ font-size:14px; color:var(--text-dim); margin-top:12px; max-width:460px; }
  .pd-stock{ margin-top:14px; }
  .pd-section-label{ font-size:12.5px; font-weight:700; margin:22px 0 10px; }
  .plan-options{ display:flex; gap:10px; flex-wrap:wrap; }
  .plan-card{
    border:1.5px solid var(--line); border-radius:12px; padding:14px 18px; min-width:110px; text-align:center;
    transition:border-color .2s, background .2s;
  }
  .plan-card.selected{ border-color:var(--purple); background:rgba(139,92,246,.06); }
  .plan-card .pd-days{ font-size:13px; font-weight:700; }
  .plan-card .pd-day-price{ font-family:var(--mono); font-size:15px; color:var(--purple-deep); margin-top:4px; }
  .qty-select-row{ display:flex; align-items:center; gap:14px; margin-top:20px; }
  .qty-box{ display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .qty-box button{ width:38px; height:38px; font-size:16px; }
  .qty-box button:hover{ background:var(--bg-deep); }
  .qty-box span{ width:40px; text-align:center; font-weight:600; }
  .pd-total{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--purple-deep); margin-top:24px; }
  .pd-actions{ display:flex; gap:12px; margin-top:20px; }

  /* ===== Buttons (generic) ===== */
  .btn-primary{ background:var(--grad-cta); color:#fff; padding:14px 28px; font-size:13.5px; font-weight:700; border-radius:999px; transition:opacity .2s; }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.3); }
  .btn-primary:hover{ opacity:.9; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-secondary{ border:1.5px solid var(--line); color:var(--text); padding:13px 24px; font-size:13.5px; font-weight:600; border-radius:999px; transition:border-color .2s; }
  .btn-secondary:hover{ border-color:var(--purple); }

  /* ===== Highlights / USP row (product list page reuse) ===== */

  /* ===== Cart drawer ===== */
  .overlay{ position:fixed; inset:0; background:rgba(30,20,50,.45); opacity:0; pointer-events:none; transition:opacity .3s; z-index:60; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:#fff; z-index:70; transform:translateX(100%); transition:transform .35s ease; display:flex; flex-direction:column; box-shadow:-20px 0 60px -20px rgba(80,50,140,.3); }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line); }
  .drawer-head h3{ font-size:16.5px; }
  .close-btn{ font-size:22px; line-height:1; padding:4px; color:var(--text-dim); }
  .drawer-items{ flex:1; overflow-y:auto; padding:8px 22px; }
  .empty-cart{ text-align:center; padding:60px 10px; color:var(--text-dim); font-size:13px; }
  .cart-item{ display:flex; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); }
  .cart-item-media{ width:46px; height:46px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; }
  .cart-item-info{ flex:1; display:flex; flex-direction:column; gap:3px; }
  .cart-item-name{ font-size:13px; font-weight:700; }
  .cart-item-plan{ font-size:11px; color:var(--purple-deep); font-family:var(--mono); }
  .cart-item-price{ font-size:12px; color:var(--text-dim); }
  .qty-row{ display:flex; align-items:center; gap:9px; margin-top:4px; }
  .qty-btn{ width:21px; height:21px; border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; }
  .qty-btn:hover{ border-color:var(--purple); color:var(--purple); }

    formData.append('amount', expectedAmount);
    try{
      const res = await fetch(SLIP_VERIFY_ENDPOINT, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if(data && data.success){
        return { ok:true, data: data.data };
      }
      return { ok:false, message: slipOkErrorMessage(data), raw: data };
    } catch(e){
      console.error('Slip verification failed:', e);
      return { ok:false, message: 'เชื่อมต่อระบบตรวจสอบสลิปไม่ได้ กรุณาลองใหม่ หรือติดต่อแอดมิน' };
    }
  }

  function slipOkErrorMessage(data){
    const code = data && data.code;
    const map = {
      1000: 'พารามิเตอร์ไม่ถูกต้อง กรุณาลองใหม่',
      1001: 'ไม่พบไฟล์รูปสลิป กรุณาแนบรูปสลิปอีกครั้ง',
      1002: 'ยอดเงินในสลิปไม่ตรงกับยอดที่ต้องชำระ',
      1003: 'สลิปนี้เคยถูกใช้ยืนยันไปแล้ว',
      1004: 'ไม่พบข้อมูลสลิปนี้ หรือสลิปหมดอายุแล้ว',
      1005: 'บัญชีผู้รับเงินในสลิปไม่ตรงกับบัญชีร้าน',
      1006: 'โควต้าการตรวจสอบสลิปของร้านเต็มแล้ว กรุณาติดต่อแอดมิน',
      1007: 'ไม่พบ QR Code ในรูปสลิป กรุณาถ่าย/แนบรูปสลิปให้ชัดเจน'
    };
    return (map[code]) || (data && data.message) || 'ไม่สามารถตรวจสอบสลิปนี้ได้ กรุณาลองใหม่ หรือติดต่อแอดมิน';
  }

  function resetSlipState(){
    state.slipVerifying = false;
    state.slipVerified = false;
    state.slipVerifyError = null;
    state.slipVerifyData = null;
  }

  function updateCheckoutPaymentArea(){
    const content = document.getElementById('payTabContent');
    if(content) content.innerHTML = payTabContent(cartSubtotal());
    const btn = document.getElementById('confirmPayBtn');
    if(btn){
      const needsSlip = (state.paymentTab === 'qr' || state.paymentTab === 'bank');
      btn.disabled = needsSlip && !state.slipVerified;
      btn.style.opacity = btn.disabled ? '.5' : '1';
    }
  }

  async function handleSlipUpload(file){
    if(!file) return;
    const isTopup = !!document.getElementById('topupPayContent');
    state.slipVerifying = true;
    state.slipVerifyError = null;
    if(isTopup) updateTopupPaymentArea(); else updateCheckoutPaymentArea();
    const amount = isTopup ? state.topupAmount : cartSubtotal();
    const result = await verifySlipWithSlipOk(file, amount);
    state.slipVerifying = false;
    if(result.ok){
      state.slipVerified = true;
      state.slipVerifyData = result.data || {};
      showToast('ตรวจสอบสลิปสำเร็จ ✓');
    } else {
      state.slipVerified = false;
      state.slipVerifyError = result.message;
    }
    if(isTopup) updateTopupPaymentArea(); else updateCheckoutPaymentArea();
  }

  function updateTopupPaymentArea(){
    const content = document.getElementById('topupPayContent');
    if(content) content.innerHTML = topupPayTabContent();
    const btn = document.getElementById('topupConfirmBtn');
    if(btn) btn.disabled = !state.slipVerified;
  }

  async function loadOrCreateCustomerProfile(uid, fallback){
    try{
      const doc = await fbDb.collection('customers').doc(uid).get();
      if(doc.exists){
        return { id: uid, ...doc.data() };
      }
      if(fallback){
        await fbDb.collection('customers').doc(uid).set(fallback);
        return { id: uid, ...fallback };
      }
      return null;
    } catch(e){
      console.error('loadOrCreateCustomerProfile failed:', e);
      return fallback ? { id: uid, ...fallback } : null;
    }
  }

  function upsertLocalCustomer(profile){
    const idx = DB.customers.findIndex(c => c.id === profile.id);
    if(idx >= 0) DB.customers[idx] = profile;
    else DB.customers.push(profile);
  }

  async function loadAllCustomersFromFirestore(){
    if(!firebaseReady || !fbDb) return;
    try{
      const snap = await fbDb.collection('customers').get();
      snap.forEach(doc => upsertLocalCustomer({ id: doc.id, ...doc.data() }));
      state.adminCustomersLoaded = true;
      refreshAdminContent();
    } catch(e){
      console.error('loadAllCustomersFromFirestore failed:', e);
      showToast('โหลดรายชื่อลูกค้าจาก Firebase ไม่สำเร็จ');
    }
  }

  if(firebaseReady){
    fbAuth.onAuthStateChanged(async (user) => {
      if(user){
        const profile = await loadOrCreateCustomerProfile(user.uid, null);
        if(profile){
          upsertLocalCustomer(profile);
          state.currentCustomerId = profile.id;
        }
      } else {
        state.currentCustomerId = null;
      }
      closeModal();
      fullRender();
    });
  }

  function genStockItems(prefix, count){
    const items = [];
    for(let i=0;i<count;i++){
      items.push({
        id: 'si' + (stockItemSeq++),
        email: prefix + (i+1) + '@nextpass-stock.example',
        password: 'Pw' + Math.random().toString(36).slice(2,8),
        note: 'บัญชีสำรอง #' + (i+1),
        variantLabel: null,
        status: 'available',
        orderId: null
      });
    }
    return items;
  }

  function tagStockItemsByVariant(){
    DB.products.forEach(p => {
      const labels = p.variants.map(v => v.label);
      if(labels.length === 0) return;
      p.stockItems.forEach((item, idx) => {
        if(!item.variantLabel) item.variantLabel = labels[idx % labels.length];
      });
    });
  }

  function getCurrentCustomer(){ return state.currentCustomerId ? findCustomer(state.currentCustomerId) : null; }
  function isApprovedAgent(customer){ return !!customer && customer.role === 'agent'; }
  function agentMultiplier(){ return (100 - (DB.settings.agentDiscountPercent||0)) / 100; }
  function agentPriceOf(price){ return Math.round(price * agentMultiplier()); }
  function effectivePrice(price){
    const cust = getCurrentCustomer();
    return isApprovedAgent(cust) ? agentPriceOf(price) : price;
  }
  function priceHtml(price){
    const cust = getCurrentCustomer();
    if(isApprovedAgent(cust)){

    }
    return baht(price);
  }

  const hasArtifactStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let hasLocalStorage = false;
  try{
    const testKey = '__nextpass_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    hasLocalStorage = true;
  } catch(e){ hasLocalStorage = false; }

  async function storageSet(key, value){
    if(hasArtifactStorage){
      try{ await window.storage.set(key, value, false); return; } catch(e){ /* fall through to localStorage */ }
    }
    if(hasLocalStorage){
      try{ window.localStorage.setItem(key, value); } catch(e){ /* storage full or blocked */ }
    }
  }

  async function storageGet(key){
    if(hasArtifactStorage){
      try{
        const res = await window.storage.get(key, false);
        if(res && res.value) return res.value;
      } catch(e){ /* not found in artifact storage, try localStorage below */ }
    }
    if(hasLocalStorage){
      try{
        const val = window.localStorage.getItem(key);
        if(val) return val;
      } catch(e){ /* ignore */ }
    }
    return null;
  }

  async function loadOrSeedProductsFromFirestore(){
    if(!firebaseReady || !fbDb) return;
    try{
      const snap = await fbDb.collection('products').get();
      if(snap.empty){
        for(const p of DB.products){
          await fbDb.collection('products').doc(p.id).set(p);
        }
      } else {
        const fetched = [];
        snap.forEach(doc => fetched.push(doc.data()));
        DB.products = fetched;
        tagStockItemsByVariant();
      }
      fullRender();
    } catch(e){
      console.error('loadOrSeedProductsFromFirestore failed:', e);
    }
  }

  async function loadAllOrdersFromFirestore(){
    if(!firebaseReady || !fbDb) return;
    try{
      const snap = await fbDb.collection('orders').orderBy('createdAt', 'desc').get();
      const fetched = [];
      snap.forEach(doc => fetched.push(doc.data()));
      DB.orders = fetched;
      state.adminOrdersLoaded = true;
      refreshAdminContent();
    } catch(e){
      console.error('loadAllOrdersFromFirestore failed:', e);
      showToast('โหลดออเดอร์จาก Firebase ไม่สำเร็จ');
    }
  }

  async function loadMyOrdersFromFirestore(customerId){
    if(!firebaseReady || !fbDb || !customerId) return;
    try{
      const snap = await fbDb.collection('orders').where('customerId', '==', customerId).get();
      snap.forEach(doc => {
        const order = doc.data();
        const idx = DB.orders.findIndex(o => o.id === order.id);
        if(idx >= 0) DB.orders[idx] = order;
        else DB.orders.push(order);
      });
      DB.orders.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    } catch(e){
      console.error('loadMyOrdersFromFirestore failed:', e);
    }
  }

  function hexToRgb(hex){
    const h = hex.replace('#','').trim();
    const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
    const num = parseInt(full, 16);
    if(full.length !== 6 || isNaN(num)) return null;
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }
  function lightenHex(hex, amt){
    const c = hexToRgb(hex);
    if(!c) return '#FFFFFF';
    return rgbToHex(c.r + (255-c.r)*amt, c.g + (255-c.g)*amt, c.b + (255-c.b)*amt);
  }
  function darkenHex(hex, amt){
    const c = hexToRgb(hex);
    if(!c) return '#000000';
    return rgbToHex(c.r*(1-amt), c.g*(1-amt), c.b*(1-amt));
  }
  function isValidHex(hex){
    return /^#?([0-9A-Fa-f]{6}|[0-9A-Fa-f]{3})$/.test((hex||'').trim());
  }
  function themeFromCustomHex(hex){
    const h = hex.trim().startsWith('#') ? hex.trim() : '#' + hex.trim();
    return {
      label:'กำหนดเอง',
      soft:`linear-gradient(120deg, ${lightenHex(h,.88)} 0%, ${lightenHex(h,.85)} 50%, ${lightenHex(h,.9)} 100%)`,
      cta:`linear-gradient(120deg, ${h}, ${darkenHex(h,.18)})`,
      swatch:h
    };
  }

  function applyTheme(themeId){
    let t;
    if(themeId === 'custom' && DB.settings.customColor){
      t = themeFromCustomHex(DB.settings.customColor);
    } else {
      t = THEME_PRESETS[themeId] || THEME_PRESETS.pink;
    }
    document.documentElement.style.setProperty('--grad-soft', t.soft);
    document.documentElement.style.setProperty('--grad-cta', t.cta);
  }

  async function loadPersistedData(){
    try{
      const raw = await storageGet('nextpass_customers');
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed.customers)) DB.customers = parsed.customers;
        if(parsed.customerSeq) DB.customerSeq = parsed.customerSeq;
      }
    } catch(e){ /* no saved accounts yet */ }
    try{
      const raw2 = await storageGet('nextpass_session');
      if(raw2){
        const parsed2 = JSON.parse(raw2);
        if(parsed2.currentCustomerId && DB.customers.find(c => c.id === parsed2.currentCustomerId)){
          state.currentCustomerId = parsed2.currentCustomerId;
        }
      }
    } catch(e){ /* no saved session yet */ }
    try{
      const raw3 = await storageGet('nextpass_orders');
      if(raw3){
        const parsed3 = JSON.parse(raw3);
        if(Array.isArray(parsed3.orders)) DB.orders = parsed3.orders;
        if(parsed3.orderSeq) DB.orderSeq = parsed3.orderSeq;
      }
    } catch(e){ /* no saved orders yet */ }
    try{
      const raw4 = await storageGet('nextpass_settings');
      if(raw4){
        const parsed4 = JSON.parse(raw4);
        Object.assign(DB.settings, parsed4);
      }
    } catch(e){ /* no saved settings yet */ }
    applyTheme(DB.settings.themeId);
  }

  function showToast(msg){

  function copyToClipboard(text, btnEl){
    function onCopied(){
      showToast('คัดลอกแล้ว ✓');
      if(btnEl){
        const original = btnEl.textContent;
        btnEl.textContent = '✓ คัดลอกแล้ว';
        btnEl.classList.add('copied');
        setTimeout(() => { btnEl.textContent = original; btnEl.classList.remove('copied'); }, 1500);
      }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  function fallbackCopy(text, onDone){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    if(onDone) onDone();
  }

  function resizeImageFile(file, maxW, maxH, cropSquare, callback){
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let sx=0, sy=0, sw=img.width, sh=img.height;
        if(cropSquare){
          const side = Math.min(img.width, img.height);
          sx = (img.width - side) / 2;
          sy = (img.height - side) / 2;
          sw = side; sh = side;
        }
        const targetW = cropSquare ? maxW : Math.min(maxW, sw);
        const targetH = cropSquare ? maxH : Math.round(targetW * (sh / sw));
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
        callback(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => showToast('ไม่สามารถอ่านไฟล์รูปภาพนี้ได้');
      img.src = e.target.result;
    };
    reader.onerror = () => showToast('ไม่สามารถอ่านไฟล์นี้ได้');
    reader.readAsDataURL(file);
  }

  /* ============================ CART ============================ */
  function cartEntries(){
    return Object.entries(state.cart).map(([key, qty]) => {
      const [id, planIdxStr] = key.split('::');
      const planIdx = Number(planIdxStr);
      const product = findProduct(id);
      if(!product) return null;
      return { key, product, plan: product.variants[planIdx], qty };
    }).filter(e => e && e.qty > 0);
  }
  function cartTotalQty(){ return cartEntries().reduce((s,e) => s + e.qty, 0); }
  function cartSubtotal(){ return cartEntries().reduce((s,e) => s + effectivePrice(e.plan.price) * e.qty, 0); }

  function addToCart(productId, planIdx, qty){
    const key = productId + '::' + planIdx;
    state.cart[key] = (state.cart[key] || 0) + qty;

  function qrPattern(seed){
    let cells = '';
    let s = seed || 7;
    for(let i=0;i<49;i++){
      s = (s * 9301 + 49297) % 233280;
      const on = (s / 233280) > 0.42;
      cells += `<span class="${on?'':'off'}"></span>`;
    }
    return cells;
  }

  function placeOrder(){
    const entries = cartEntries();
    const total = cartSubtotal();
    const cust = getCurrentCustomer();
    if(!cust){
      showToast('กรุณาเข้าสู่ระบบก่อนสั่งซื้อ');
      openAuthModal('login');
      return;
    }
    if((state.paymentTab === 'qr' || state.paymentTab === 'bank') && !state.slipVerified){
      showToast('กรุณาแนบสลิปโอนเงินและรอตรวจสอบให้สำเร็จก่อนยืนยันการชำระเงิน');
      return;
    }
    if(state.paymentTab === 'wallet'){
      if((cust.balance||0) < total){
        showToast('ยอดเงินในบัญชีไม่พอ กรุณาเติมเงินหรือเลือกช่องทางอื่น');
        return;
      }
      cust.balance -= total;
      persistCustomerProfile(cust);
    }
    state.lastCustomer = { name: cust.name, email: cust.username };
    DB.orderSeq++;
    const orderId = 'NP' + DB.orderSeq;
    const paymentLabel = state.paymentTab === 'qr' ? 'PromptPay QR' : (state.paymentTab === 'wallet' ? 'ยอดเงินในบัญชี' : 'โอนผ่านธนาคาร');
    const order = {
      id: orderId,
      customer: {...state.lastCustomer},
      customerId: cust ? cust.id : null,
      isAgentOrder: isApprovedAgent(cust),
      items: entries.map(e => ({ productId:e.product.id, name:e.product.name, label:e.plan.label, price:effectivePrice(e.plan.price), qty:e.qty })),
      total,
      paymentMethod: paymentLabel,
      status: 'pending',
      slipVerified: (state.paymentTab === 'qr' || state.paymentTab === 'bank') ? true : false,
      slipVerifyRef: state.slipVerifyData ? (state.slipVerifyData.transRef || null) : null,
      createdAt: new Date().toISOString()
    };
    // deduct stock immediately in this simulation once payment is "confirmed" at the end of the flow
    DB.orders.unshift(order);
    persistOrders();
    persistOrderToFirestore(order);
    state.lastOrderId = orderId;
    state.cart = {};
    state.orderFlowIndex = 0;
    resetSlipState();
    renderCartDrawer();
    goto('orderStatus');
    runOrderFlow(order);
  }

  const FLOW_STEPS = [
    {label:'ชำระเงิน', desc:'ได้รับคำสั่งซื้อและยืนยันการชำระเงินของคุณ'},

    {label:'ตัดสต๊อก', desc:'จองสินค้าและตัดจำนวนคงเหลือในระบบ'},
    {label:'ส่งสินค้าอัตโนมัติ', desc:'ส่งข้อมูลบัญชีไปยังอีเมลของคุณโดยอัตโนมัติ'}
  ];

  function runOrderFlow(order){
    state.orderFlowIndex = 0;
    updateOrderStatusView();
    const timers = [900, 1600, 1500];
    let step = 0;
    function next(){
      if(step >= timers.length){
        // finalize: assign real stock item credentials matching the purchased variant, mark used
        order.items.forEach(it => {
          const p = findProduct(it.productId);
          if(!p) return;
          const matching = availableItems(p).filter(item => item.variantLabel === it.label);
          const toAssign = matching.slice(0, it.qty);
          toAssign.forEach(item => { item.status = 'used'; item.orderId = order.id; });
          it.delivered = toAssign.map(item => ({ email:item.email, password:item.password, note:item.note }));
          it.shortfall = it.qty - toAssign.length;
          if(toAssign.length > 0) persistProductToFirestore(p);
        });
        order.status = 'done';
        state.orderFlowIndex = FLOW_STEPS.length;
        updateOrderStatusView();
        persistOrders();
        persistOrderToFirestore(order);
        return;
      }
      setTimeout(() => {
        step++;
        state.orderFlowIndex = step;
        order.status = ['pending','verify','stock','done'][step] || 'done';
        updateOrderStatusView();
        next();
      }, timers[step]);
    }
    next();
  }

  function renderAdminView(){
    if(!state.adminAuth){
      routerEl.innerHTML = adminLoginTemplate();
      const loginBtn = document.getElementById('adminLoginBtn');
      if(loginBtn) loginBtn.addEventListener('click', handleAdminLoginSubmit);
    } else {
      routerEl.innerHTML = adminShellTemplate(adminContentBySection());
      if((state.adminSection === 'customers' || state.adminSection === 'agents') && firebaseReady && !state.adminCustomersLoaded){
        loadAllCustomersFromFirestore();
      }
      if(state.adminSection === 'orders' && firebaseReady && !state.adminOrdersLoaded){
        loadAllOrdersFromFirestore();
      }
      const searchInput = document.getElementById('adminOrderSearchInput');
      if(searchInput){
        searchInput.addEventListener('input', (e) => {
          state.adminOrderSearch = e.target.value;
          updateAdminOrdersTable();
        });
      }
      const custSearchInput = document.getElementById('adminCustomerSearchInput');
      if(custSearchInput){
        custSearchInput.addEventListener('input', (e) => {
          state.adminCustomerSearch = e.target.value;
          updateAdminCustomersTable();
        });
      }
      const logoInput = document.getElementById('setLogoInput');
      if(logoInput){
        logoInput.addEventListener('change', (e) => {
          if(e.target.files && e.target.files[0]) handleLogoUpload(e.target.files[0]);
        });
      }
      const bannerInput = document.getElementById('setBannerInput');
      if(bannerInput){
        bannerInput.addEventListener('change', (e) => {
          if(e.target.files && e.target.files[0]) handleBannerUpload(e.target.files[0]);
        });
      }
      const qrInput = document.getElementById('setQrInput');
      if(qrInput){
        qrInput.addEventListener('change', (e) => {
          if(e.target.files && e.target.files[0]) handleQrUpload(e.target.files[0]);
        });
      }
      const hexInput = document.getElementById('customHexInput');
      const hexSwatch = document.getElementById('customHexSwatch');
      if(hexInput){
        hexInput.addEventListener('input', (e) => {
          if(hexSwatch && isValidHex(e.target.value)){
            const v = e.target.value.trim();
            hexSwatch.style.background = v.startsWith('#') ? v : '#' + v;
          }
        });
        hexInput.addEventListener('keydown', (e) => {
          if(e.key === 'Enter'){ e.preventDefault(); handlePreviewCustomHex(hexInput.value); }
        });
      }
      const hexPreviewBtn = document.getElementById('customHexPreviewBtn');
      if(hexPreviewBtn){
        hexPreviewBtn.addEventListener('click', () => {
          const input = document.getElementById('customHexInput');
          handlePreviewCustomHex(input ? input.value : '');
        });
      }
    }
  }

  async function handleAuthSubmit(){
    const isLogin = state.authMode === 'login';
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    const usernameInvalid = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username);
    const passwordInvalid = password.length < 4;
    toggleFieldError('authUsername', usernameInvalid);
    toggleFieldError('authPassword', passwordInvalid);

    const submitBtn = document.getElementById('authSubmitBtn');

    if(isLogin){
      if(usernameInvalid || passwordInvalid) return;

      if(firebaseReady){
        if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังเข้าสู่ระบบ...'; }
        try{
          await fbAuth.signInWithEmailAndPassword(username, password);
          // onAuthStateChanged listener handles loading profile + closing modal + re-render
          showToast('เข้าสู่ระบบสำเร็จ');
        } catch(e){
          showToast(firebaseAuthErrorMessage(e));
        } finally {
          if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'เข้าสู่ระบบ'; }
        }
        return;
      }

      // Local fallback (used only if Firebase failed to initialize)
      const cust = findCustomerByUsername(username);
      if(!cust){
        showToast('ไม่พบบัญชีนี้ในระบบ');
        return;
      }
      if(cust.password !== password){
        showToast('รหัสผ่านไม่ถูกต้อง');
        return;
      }
      state.currentCustomerId = cust.id;
      persistSession();
      closeModal();
      fullRender();
      showToast('เข้าสู่ระบบสำเร็จ (โหมดออฟไลน์)');
    } else {
      const name = document.getElementById('authName').value.trim();
      const nameInvalid = name.length < 2;
      toggleFieldError('authName', nameInvalid);
      if(nameInvalid || usernameInvalid || passwordInvalid) return;

      if(firebaseReady){
        if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'กำลังสมัครสมาชิก...'; }
        try{
          const cred = await fbAuth.createUserWithEmailAndPassword(username, password);
          const uid = cred.user.uid;
          const profile = {
            username, name,
            role: 'customer',
            balance: 0,
            appliedAt: null,
            approvedAt: null,
            createdAt: new Date().toISOString()
          };
          await fbDb.collection('customers').doc(uid).set(profile);
          state.authMode = 'login';
          // onAuthStateChanged listener handles loading profile + closing modal + re-render
          showToast('สมัครสมาชิกสำเร็จ');
        } catch(e){
          showToast(firebaseAuthErrorMessage(e));
        } finally {
          if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'สมัครสมาชิก'; }
        }
        return;
      }

      // Local fallback (used only if Firebase failed to initialize)
      if(findCustomerByUsername(username)){
        showToast('อีเมลนี้มีคนใช้แล้ว');
        return;
      }
      const cust = {
        id: 'cu' + (DB.customerSeq++),
        username, password, name,
        role: 'customer',
        balance: 0,
        appliedAt: null,
        approvedAt: null,
        createdAt: new Date().toISOString()
      };
      DB.customers.push(cust);
      state.currentCustomerId = cust.id;
      state.authMode = 'login';
      persistCustomers();
      persistSession();
      closeModal();
      fullRender();
      showToast('สมัครสมาชิกสำเร็จ (โหมดออฟไลน์)');
    }
  }

          </div>
        </div>
        <div class="field">
          <label>ตัวเลือกสินค้าและราคา</label>
          <div id="variantRows">${variantRowsHtml()}</div>
          <button type="button" class="btn-secondary" data-action="admin-add-variant-row" style="width:100%; margin-top:8px; font-size:12.5px; padding:10px;">+ เพิ่มตัวเลือก</button>
        </div>
        ${!editing ? `<div class="proto-note">สินค้าใหม่จะยังไม่มีบัญชีในสต๊อก ไปที่เมนู "สต๊อก" เพื่อเพิ่มบัญชีหลังบันทึก</div>` : ''}
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-action="close-modal" style="flex:1;">ยกเลิก</button>
          <button type="button" id="productFormSaveBtn" class="btn-primary form-submit-btn" style="flex:1.4;">บันทึก</button>
        </div>
      </form>
    `);
    const fileInput = document.getElementById('mpImageFile');
    const urlInput = document.getElementById('mpImage');
    const previewWrap = document.getElementById('mpImagePreviewWrap');
    const previewImg = document.getElementById('mpImagePreview');
    if(fileInput){
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          urlInput.value = reader.result;
          previewImg.src = reader.result;
          previewWrap.style.display = '';
        };
        reader.readAsDataURL(file);
      });
    }
    if(urlInput){
      urlInput.addEventListener('input', () => {
        if(urlInput.value.trim()){
          previewImg.src = urlInput.value.trim();
          previewWrap.style.display = '';
        } else {
          previewWrap.style.display = 'none';
        }
      });
    }
  }

  function syncVariantRowsFromDOM(){
    const rows = document.querySelectorAll('#variantRows .variant-row');
    const collected = [];
    rows.forEach(row => {

      const price = Number(row.querySelector('.variant-price-input').value) || 0;
      collected.push({label, price});

    if(collected.length) state.editingVariants = collected;
  }

      case 'checkout': return checkoutTemplate();
      case 'orderStatus': return orderStatusTemplate();
      case 'admin': return null; // handled separately (has its own shell)
      default: return storeTemplate();
    }
  }

  const CUSTOMER_ROUTES = ['checkout', 'orderStatus'];

  function fullRender(){
    headerEl.innerHTML = headerTemplate();
    if(CUSTOMER_ROUTES.includes(state.route) && !getCurrentCustomer()){
      routerEl.innerHTML = gateTemplate();
      footerEl.innerHTML = '';
      return;
    }
    if(state.route === 'store'){
      renderStoreView();
    } else if(state.route === 'product'){
      renderProductDetail();
    } else if(state.route === 'checkout'){
      routerEl.innerHTML = checkoutTemplate();
    } else if(state.route === 'orderStatus'){
      renderOrderStatusView();
    } else if(state.route === 'admin'){
      renderAdminView();
    }
    footerEl.innerHTML = footerTemplate();
    renderCartDrawer();
  }

  /* ============================ EVENT DELEGATION ============================ */
  document.addEventListener('click', (e) => {
    // header/footer nav actions
    const goEl = e.target.closest('[data-action]');
    if(goEl){
      const action = goEl.dataset.action;
      switch(action){
        case 'go-store': e.preventDefault(); if(state.previewThemeId){ applyTheme(DB.settings.themeId); state.previewThemeId=null; } state.search=''; state.categoryFilter='all'; goto('store'); return;
        case 'go-bestseller': e.preventDefault(); goto('store'); setTimeout(() => { const el=document.getElementById('bestsellers'); if(el) el.scrollIntoView({behavior:'smooth'}); }, 50); return;
        case 'go-contact': e.preventDefault(); goto('store'); setTimeout(() => { const el=document.getElementById('contact'); if(el) el.scrollIntoView({behavior:'smooth'}); }, 50); return;
        case 'scroll-products': e.preventDefault(); { const el=document.getElementById('products'); if(el) el.scrollIntoView({behavior:'smooth'}); } return;
        case 'go-product': {
          e.preventDefault();
          const id = goEl.dataset.id;
          state.productId = id;
          const p = findProduct(id);
          state.selectedPlanIdx = p ? Math.min(1, p.variants.length - 1) : 0;
          state.qty = 1;
          goto('product');
          return;
        }
        case 'go-admin': e.preventDefault(); goto('admin'); return;
        case 'admin-logout': e.preventDefault(); if(state.previewThemeId){ applyTheme(DB.settings.themeId); state.previewThemeId=null; } state.adminAuth=false; state.adminSection='dashboard'; goto('admin'); return;
        case 'open-auth': e.preventDefault(); openAuthModal('login'); return;
        case 'open-account': e.preventDefault(); openAccountModal(); return;
        case 'open-order-history': e.preventDefault(); openOrderHistoryModal(); return;
        case 'view-order-history-detail': e.preventDefault(); openModal(orderHistoryDetailModalHtml(goEl.dataset.id)); return;
        case 'switch-to-register': e.preventDefault(); state.authMode='register'; if(CUSTOMER_ROUTES.includes(state.route) && !getCurrentCustomer()){ routerEl.innerHTML = gateTemplate(); } else { openModal(authModalHtml()); } return;
        case 'switch-to-login': e.preventDefault(); state.authMode='login'; if(CUSTOMER_ROUTES.includes(state.route) && !getCurrentCustomer()){ routerEl.innerHTML = gateTemplate(); } else { openModal(authModalHtml()); } return;
        case 'logout': {
          e.preventDefault();
          state.authMode='login';
          if(firebaseReady && fbAuth.currentUser){
            fbAuth.signOut().then(() => showToast('ออกจากระบบแล้ว'));
          } else {
            state.currentCustomerId=null;
            persistSession();
            closeModal();
            fullRender();
            showToast('ออกจากระบบแล้ว');
          }
          return;
        }
        case 'apply-agent-banner': e.preventDefault(); handleApplyAgentBanner(); return;
        case 'copy-value': e.preventDefault(); copyToClipboard(goEl.dataset.copy || '', goEl); return;
        case 'open-topup': e.preventDefault(); openTopupModal(); return;
        case 'clear-slip': e.preventDefault(); resetSlipState(); updateCheckoutPaymentArea(); return;
        case 'pd-inc': {
          const p = findProduct(state.productId);
          const max = p ? availableCount(p) : 999;
          if(state.qty >= max){ showToast('มีสต๊อกไม่พอ'); return; }
          state.qty++; updateProductDetailPricing(); return;
        }
        case 'pd-dec': state.qty = Math.max(1, state.qty-1); updateProductDetailPricing(); return;
        case 'close-modal': closeModal(); return;
        case 'admin-add-product': openProductModal(null); return;
        case 'admin-edit-product': openProductModal(goEl.dataset.id); return;
        case 'admin-delete-product': {
          const id = goEl.dataset.id;
          DB.products = DB.products.filter(p => p.id !== id);
          deleteProductFromFirestore(id);
          refreshAdminContent();
          showToast('ลบสินค้าแล้ว');
          return;
        }
        case 'admin-add-category': openCategoryModal(); return;
        case 'admin-delete-category': {
          const id = goEl.dataset.id;
          DB.categories = DB.categories.filter(c => c.id !== id);
          refreshAdminContent();
          showToast('ลบหมวดหมู่แล้ว');
          return;
        }
        case 'admin-add-stock-item': openStockItemModal(goEl.dataset.id); return;
        case 'admin-edit-stock-item': openStockItemModal(goEl.dataset.id, goEl.dataset.item); return;
        case 'admin-add-variant-row': {
          syncVariantRowsFromDOM();
          state.editingVariants.push({label:'', price:''});
          const container = document.getElementById('variantRows');
          if(container) container.innerHTML = variantRowsHtml();
          return;
        }
        case 'admin-remove-variant-row': {
          syncVariantRowsFromDOM();
          const idx = Number(goEl.dataset.idx);
          state.editingVariants.splice(idx, 1);
          if(state.editingVariants.length === 0) state.editingVariants.push({label:'', price:''});
          const container = document.getElementById('variantRows');
          if(container) container.innerHTML = variantRowsHtml();
          return;
        }
        case 'admin-view-delivered': {
          const o = DB.orders.find(o => o.id === goEl.dataset.id);
          if(o){
            openModal(`
              <h3>ข้อมูลบัญชีที่ส่งให้ลูกค้า</h3>
              <p class="admin-sub">ออเดอร์ ${o.id} · ${o.customer.name || '-'}</p>
              ${deliveredAccountsHtml(o)}
              <div class="modal-actions"><button type="button" class="btn-secondary" data-action="close-modal" style="flex:1;">ปิด</button></div>
            `);
          }
          return;
        }
        case 'admin-delete-stock-item': {
          const p = findProduct(goEl.dataset.id);
          if(p){
            p.stockItems = p.stockItems.filter(i => i.id !== goEl.dataset.item);
            persistProductToFirestore(p);
            refreshAdminContent();
            showToast('ลบบัญชีสต๊อกแล้ว');
          }
          return;
        }
        case 'admin-advance-order': {
          const o = DB.orders.find(o => o.id === goEl.dataset.id);
          if(o){
            const order_flow = ['pending','verify','stock','done'];
            const idx = order_flow.indexOf(o.status);
            if(idx < order_flow.length - 1){
              o.status = order_flow[idx+1];
            }
            persistOrders();
            persistOrderToFirestore(o);
            refreshAdminContent();
            showToast('อัปเดตสถานะออเดอร์แล้ว');
          }
          return;
        }
        case 'admin-topup-customer': e.preventDefault(); openAdminTopupModal(goEl.dataset.id); return;
        case 'pick-theme': e.preventDefault(); handlePreviewTheme(goEl.dataset.theme); return;
        case 'confirm-theme': e.preventDefault(); handleConfirmTheme(); return;
        case 'cancel-preview-theme': e.preventDefault(); handleCancelPreviewTheme(); return;
        case 'remove-logo': e.preventDefault(); DB.settings.logoImage=null; persistSettings(); refreshAdminContent(); fullRender(); showToast('ลบโลโก้แล้ว'); return;
        case 'remove-banner': e.preventDefault(); DB.settings.bannerImage=null; persistSettings(); refreshAdminContent(); fullRender(); showToast('ลบแบนเนอร์แล้ว'); return;
        case 'remove-qr': e.preventDefault(); DB.settings.qrCodeImage=null; persistSettings(); refreshAdminContent(); showToast('ลบ QR แล้ว'); return;
        case 'admin-approve-agent': {
          const c = findCustomer(goEl.dataset.id);
          if(c){
            c.role = 'agent';
            c.approvedAt = new Date().toISOString();
            persistCustomerProfile(c);
            refreshAdminContent();
            showToast('อนุมัติตัวแทนแล้ว');
          }
          return;
        }
        case 'admin-reject-agent': {
          const c = findCustomer(goEl.dataset.id);
          if(c){
            c.role = 'customer';
            c.appliedAt = null;
            persistCustomerProfile(c);
            refreshAdminContent();
            showToast('ปฏิเสธคำขอแล้ว');
          }
          return;
        }
        case 'admin-revoke-agent': {
          const c = findCustomer(goEl.dataset.id);
          if(c){
            c.role = 'customer';
            c.approvedAt = null;
            persistCustomerProfile(c);
            refreshAdminContent();
            showToast('ยกเลิกสถานะตัวแทนแล้ว');
          }
          return;
        }
      }
    }

    // plan selection on product detail
    const planBtn = e.target.closest('#planOptions .plan-card');
    if(planBtn){
      state.selectedPlanIdx = Number(planBtn.dataset.plan);
      updateProductDetailPricing();
      return;
    }
    if(e.target.id === 'pdAddBtn'){
      if(!getCurrentCustomer()){
        showToast('กรุณาสมัครสมาชิกหรือเข้าสู่ระบบก่อนซื้อสินค้า');
        openAuthModal('login');
        return;
      }
      addToCart(state.productId, state.selectedPlanIdx, state.qty);
      showToast('เพิ่มลงตะกร้าแล้ว ✓');
      return;
    }

    // category chips
    const chipBtn = e.target.closest('#chips .chip');
    if(chipBtn){
      state.categoryFilter = chipBtn.dataset.cat;
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('active', c === chipBtn));
      updateStoreGrid();
      return;
    }

    // payment tabs
    const payTab = e.target.closest('.pay-tab');
    if(payTab && payTab.dataset.topupTab){
      state.topupPaymentTab = payTab.dataset.topupTab;
      resetSlipState();
      document.querySelectorAll('.modal [data-topup-tab]').forEach(t => t.classList.toggle('active', t === payTab));
      updateTopupPaymentArea();
      return;
    }
    if(payTab){
      state.paymentTab = payTab.dataset.tab;
      resetSlipState();
      document.querySelectorAll('.pay-tab').forEach(t => t.classList.toggle('active', t === payTab));
      updateCheckoutPaymentArea();
      return;
    }

    // topup amount quick-select
    const topupAmountBtn = e.target.closest('.topup-amount-btn');
    if(topupAmountBtn){
      state.topupAmount = Number(topupAmountBtn.dataset.amount);
      resetSlipState();
      document.querySelectorAll('.topup-amount-btn').forEach(b => b.classList.toggle('selected', b === topupAmountBtn));
      const input = document.getElementById('topupCustomInput');
      if(input) input.value = state.topupAmount;
      updateTopupPaymentArea();
      return;
    }
    if(e.target.id === 'confirmPayBtn'){
      placeOrder();
      return;
    }

    // admin sidebar nav
    const adminNavEl = e.target.closest('[data-admin-section]');
    if(adminNavEl){
      e.preventDefault();
      if(state.adminSection === 'settings' && adminNavEl.dataset.adminSection !== 'settings' && state.previewThemeId){
        handleCancelPreviewTheme();
      }
      state.adminSection = adminNavEl.dataset.adminSection;
      refreshAdminContent();
      return;
    }

    // cart drawer item actions
    const cartActionBtn = e.target.closest('.cart-item [data-action]');
    if(cartActionBtn){
      const itemEl = e.target.closest('.cart-item');
      const key = itemEl.dataset.key;
      const action = cartActionBtn.dataset.action;
      if(action === 'inc') state.cart[key]++;
      if(action === 'dec') state.cart[key] = Math.max(0, state.cart[key]-1);
      if(action === 'remove') state.cart[key] = 0;
      renderCartDrawer();
      updateCartCountBadge();
      return;
    }

    if(e.target.id === 'cartOpenBtn' || e.target.closest('#cartOpenBtn')){ openDrawer(); return; }
    if(e.target.id === 'closeDrawerBtn'){ closeDrawer(); return; }
    if(e.target.id === 'overlay'){ closeDrawer(); return; }
    if(e.target === overlay){ closeDrawer(); return; }
    if(e.target.id === 'checkoutBtn'){
      if(checkoutBtn.disabled) return;
      if(!getCurrentCustomer()){
        closeDrawer();
        showToast('กรุณาสมัครสมาชิกหรือเข้าสู่ระบบก่อนชำระเงิน');
        openAuthModal('login');
        return;
      }
      closeDrawer();
      resetSlipState();
      goto('checkout');
      return;
    }
    if(e.target.id === 'modalOverlay'){ closeModal(); return; }
  });

  function handleAdminLoginSubmit(){
    const u = document.getElementById('ausername').value.trim();
    const pw = document.getElementById('apassword').value;
    const uEmpty = u.length === 0;
    const pEmpty = pw.length === 0;
    toggleFieldError('username', uEmpty);
    toggleFieldError('password', pEmpty);
    if(uEmpty || pEmpty) return;
    const credsInvalid = (u !== ADMIN_CREDS.username) || (pw !== ADMIN_CREDS.password);
    const errEl = document.getElementById('adminLoginError');
    if(credsInvalid){
      if(errEl) errEl.style.display = 'block';
      return;
    }
    if(errEl) errEl.style.display = 'none';
    state.adminAuth = true;
    state.adminSection = 'dashboard';
    goto('admin');
    showToast('เข้าสู่ระบบสำเร็จ');
  }

  function handleProductFormSubmit(){
    const name = document.getElementById('mpName').value.trim();
    const cat = document.getElementById('mpCat').value;
    const desc = document.getElementById('mpDesc').value.trim();
    const image = document.getElementById('mpImage').value.trim();
    syncVariantRowsFromDOM();
    const variants = state.editingVariants
      .map(v => ({ label: v.label.trim(), price: Number(v.price) || 0 }))
      .filter(v => v.label.length > 0);
    if(!name){ showToast('กรุณากรอกชื่อสินค้า'); return; }
    if(variants.length === 0){ showToast('กรุณาใส่ตัวเลือกสินค้าอย่างน้อย 1 รายการ'); return; }
    let savedProduct;
    if(state.editingProductId){
      const p = findProduct(state.editingProductId);
      Object.assign(p, { name, cat, desc, image: image || null, variants });
      savedProduct = p;
      showToast('บันทึกการแก้ไขแล้ว');
    } else {
      const id = 'p' + Date.now();
      savedProduct = { id, cat, badge:'badge-vpn', glyph:name.slice(0,2).toUpperCase(), image: image || null, name, desc, bestSeller:false, variants, stockItems:[] };
      DB.products.push(savedProduct);
      showToast('เพิ่มสินค้าใหม่แล้ว');
    }
    persistProductToFirestore(savedProduct);
    closeModal();
    refreshAdminContent();
  }

  function handleStockItemFormSubmit(){
    const email = document.getElementById('siEmail').value.trim();
    const password = document.getElementById('siPassword').value.trim();
    const note = document.getElementById('siNote').value.trim();
    const variantLabel = document.getElementById('siVariant').value;
    const emailInvalid = email.length < 3;
    const passwordInvalid = password.length < 1;
    toggleFieldError('siEmail', emailInvalid);
    toggleFieldError('siPassword', passwordInvalid);
    if(emailInvalid || passwordInvalid) return;
    const p = findProduct(state.editingProductId);
    if(p){
      if(state.editingStockItemId){
        const item = p.stockItems.find(i => i.id === state.editingStockItemId);
        if(item){
          Object.assign(item, { email, password, note, variantLabel });
          showToast('บันทึกการแก้ไขบัญชีสต๊อกแล้ว');
        }
      } else {
        p.stockItems.push({ id:'si'+Date.now()+Math.floor(Math.random()*1000), email, password, note, variantLabel, status:'available', orderId:null });
        showToast('เพิ่มบัญชีสต๊อกแล้ว');
      }
      persistProductToFirestore(p);
    }
    state.editingStockItemId = null;
    closeModal();
    refreshAdminContent();
  }

  function handleCategoryFormSubmit(){
    const label = document.getElementById('mcLabel').value.trim();
    if(!label){ showToast('กรุณากรอกชื่อหมวดหมู่'); return; }
    const id = 'c' + Date.now();
    DB.categories.push({ id, label });
    showToast('เพิ่มหมวดหมู่แล้ว');
    closeModal();
    refreshAdminContent();
  }

  function handleAdminSettingsSubmit(){
    DB.settings.shopName = document.getElementById('setName').value.trim() || DB.settings.shopName;
    DB.settings.shopLink = document.getElementById('setLink').value.trim();
    DB.settings.shopDesc = document.getElementById('setDesc').value.trim();
    DB.settings.contactEmail = document.getElementById('setEmail').value.trim();
    DB.settings.contactLine = document.getElementById('setLine').value.trim();
    const discount = Number(document.getElementById('setAgentDiscount').value);
    if(!isNaN(discount) && discount >= 0 && discount <= 90) DB.settings.agentDiscountPercent = discount;
    document.title = DB.settings.shopName + ' — ปลดล็อกแอปพรีเมียม ราคาเบาๆ';
    persistSettings();
    refreshAdminContent();
    fullRender();
    showToast('บันทึกการตั้งค่าแล้ว');
  }

  function handlePreviewTheme(themeId){
    if(!THEME_PRESETS[themeId]) return;
    state.previewThemeId = themeId;
    applyTheme(themeId);
    refreshAdminContent();
  }

  function handlePreviewCustomHex(hexRaw){
    const hex = (hexRaw||'').trim();
    if(!isValidHex(hex)){
      const errEl = document.getElementById('customHexError');
      if(errEl) errEl.style.display = 'block';
      return;
    }
    const errEl = document.getElementById('customHexError');
    if(errEl) errEl.style.display = 'none';
    const normalized = hex.startsWith('#') ? hex : '#' + hex;
    state.previewThemeId = 'custom';
    state.previewCustomHex = normalized;
    document.documentElement.style.setProperty('--grad-soft', themeFromCustomHex(normalized).soft);
    document.documentElement.style.setProperty('--grad-cta', themeFromCustomHex(normalized).cta);
    refreshAdminContent();
  }

  function handleConfirmTheme(){
    if(state.previewThemeId === 'custom'){
      if(!isValidHex(state.previewCustomHex)) return;
      DB.settings.themeId = 'custom';
      DB.settings.customColor = state.previewCustomHex.startsWith('#') ? state.previewCustomHex : '#' + state.previewCustomHex;
      state.previewThemeId = null;
      persistSettings();
      refreshAdminContent();
      showToast('บันทึกสีที่กำหนดเองแล้ว ✓');
      return;
    }
    if(!state.previewThemeId || !THEME_PRESETS[state.previewThemeId]) return;
    DB.settings.themeId = state.previewThemeId;
    state.previewThemeId = null;
    persistSettings();
    refreshAdminContent();
    showToast('บันทึกธีมสีแล้ว ✓');
  }

  function handleCancelPreviewTheme(){
    state.previewThemeId = null;
    state.previewCustomHex = '';
    applyTheme(DB.settings.themeId);
    refreshAdminContent();
  }

  function handleLogoUpload(file){
    if(!file) return;
    resizeImageFile(file, 512, 512, true, (dataUrl) => {
      DB.settings.logoImage = dataUrl;
      persistSettings();
      refreshAdminContent();
      fullRender();
      showToast('อัปโหลดโลโก้แล้ว');
    });
  }

  function handleBannerUpload(file){
    if(!file) return;
    resizeImageFile(file, 1600, 500, false, (dataUrl) => {
      DB.settings.bannerImage = dataUrl;
      persistSettings();
      refreshAdminContent();
      fullRender();
      showToast('อัปโหลดแบนเนอร์แล้ว');
    });
  }

  function handleAdminPaymentSubmit(){
    DB.settings.bankName = document.getElementById('setBankName').value.trim();
    DB.settings.bankAccountNumber = document.getElementById('setBankAccountNumber').value.trim();
    DB.settings.bankAccountName = document.getElementById('setBankAccountName').value.trim();
    DB.settings.promptpayId = document.getElementById('setPromptpayId').value.trim();
    persistSettings();
    refreshAdminContent();
    showToast('บันทึกข้อมูลการชำระเงินแล้ว');
  }

  function handleQrUpload(file){
    if(!file) return;
    resizeImageFile(file, 600, 600, true, (dataUrl) => {
      DB.settings.qrCodeImage = dataUrl;
      persistSettings();
      refreshAdminContent();
      showToast('อัปโหลด QR พร้อมเพย์แล้ว');
    });
  }

  document.addEventListener('click', (e) => {
    switch(e.target.id){
      case 'productFormSaveBtn': handleProductFormSubmit(); return;
      case 'stockItemFormSaveBtn': handleStockItemFormSubmit(); return;
      case 'categoryFormSaveBtn': handleCategoryFormSubmit(); return;
      case 'adminSettingsSaveBtn': handleAdminSettingsSubmit(); return;
      case 'adminPaymentSaveBtn': handleAdminPaymentSubmit(); return;
      case 'authSubmitBtn': handleAuthSubmit(); return;
      case 'applyAgentBtn': handleApplyAgent(); return;
      case 'topupConfirmBtn': handleTopupSubmit(); return;
      case 'adminTopupSaveBtn': handleAdminTopupSubmit(); return;
    }
  });

  document.addEventListener('change', (e) => {
    if(e.target.id === 'slipUploadInput' && e.target.files && e.target.files[0]){
      handleSlipUpload(e.target.files[0]);
    }
  });

  document.addEventListener('input', (e) => {
    if(e.target.id === 'topupCustomInput'){
      state.topupAmount = Number(e.target.value) || 0;
      if(state.slipVerified || state.slipVerifyError){
        resetSlipState();
        updateTopupPaymentArea();
      }
    }
  });

  // Prevent native form submission entirely (some sandboxed preview environments
  // don't allow it) — all logic above runs via direct button clicks instead.
  document.addEventListener('submit', (e) => { e.preventDefault(); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ closeModal(); closeDrawer(); }
    if(e.key === 'Enter' && e.target.tagName === 'INPUT'){
      const form = e.target.closest('form');
      if(form){
        const btn = form.querySelector('.form-submit-btn');
        if(btn){ e.preventDefault(); btn.click(); }
      }
    }
  });

  /* ============================ INIT ============================ */
  tagStockItemsByVariant();
  fullRender();
  loadPersistedData().then(() => {
    tagStockItemsByVariant();
    document.title = DB.settings.shopName + ' — ปลดล็อกแอปพรีเมียม ราคาเบาๆ';
    fullRender();
    loadOrSeedProductsFromFirestore();
  });
})();
</script>

</body>
</html>
