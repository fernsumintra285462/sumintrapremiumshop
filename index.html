<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTPASS — ปลดล็อกแอปพรีเมียม ราคาเบาๆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF9FF;
    --bg-deep:#F3EEFF;
    --surface:#FFFFFF;
    --line:#E7DFFB;
    --text:#221A3D;
    --text-dim:#766C93;
    --purple:#8B5CF6;
    --purple-deep:#7C3AED;
    --pink:#EC4899;
    --blue:#3B82F6;
    --coral:#FF6B4A;
    --success:#10B981;
    --warn:#F59E0B;
    --danger:#EF4444;
    --radius:14px;
    --mono:'IBM Plex Mono', monospace;
    --grad: linear-gradient(120deg, var(--purple), var(--pink) 55%, var(--blue));
    --grad-soft: linear-gradient(120deg, #F3E6FF 0%, #FCE0F1 45%, #DCEBFF 100%);
    --grad-cta: linear-gradient(120deg, #F536A0, #D6127A);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans Thai', sans-serif; font-weight:300; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, select, textarea{ font-family:inherit; }
  ul{ list-style:none; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ===== Logo mark ===== */
  .logo-mark{
    width:32px; height:32px; border-radius:10px; flex-shrink:0;
    background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff; font-size:14px;
    box-shadow:0 6px 16px -6px rgba(139,92,246,.6);
  }
  .logo-mark-img{ object-fit:cover; background:var(--surface); box-shadow:none; border:1px solid var(--line); }

  /* ===== Header ===== */
  #siteHeader{ position:sticky; top:0; z-index:40; background:rgba(251,249,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; gap:18px; height:68px; }
  .brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .brand-text{ font-size:18px; font-weight:700; }
  .brand-text span{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav.main-nav{ display:flex; gap:26px; flex-shrink:0; }
  nav.main-nav a{ font-size:13.5px; font-weight:600; color:var(--text-dim); transition:color .2s; }
  nav.main-nav a:hover{ color:var(--purple-deep); }
  .header-search{ flex:1; max-width:340px; position:relative; }
  .header-search input{
    width:100%; border:1px solid var(--line); border-radius:999px; padding:9px 16px 9px 34px;
    font-size:13px; background:var(--surface); color:var(--text);
  }
  .header-search input:focus{ border-color:var(--purple); outline:none; }
  .header-search .si{ position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-dim); }
  .admin-search-bar{ position:relative; max-width:480px; margin-bottom:18px; }
  .admin-search-bar input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 16px 11px 36px;
    font-size:13px; background:var(--surface); color:var(--text);
  }
  .admin-search-bar input:focus{ border-color:var(--purple); outline:none; }
  .admin-search-bar .si{ position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-dim); }
  .header-actions{ display:flex; align-items:center; gap:10px; margin-left:auto; flex-shrink:0; }
  .admin-link{ font-size:12px; color:var(--text-dim); font-weight:600; border:1px solid var(--line); padding:8px 12px; border-radius:999px; transition:border-color .2s; }
  .admin-link:hover{ border-color:var(--purple); }
  .cart-btn{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; border:1px solid var(--line); padding:9px 15px; border-radius:999px; transition:border-color .2s, background .2s; }
  .cart-btn:hover{ border-color:var(--purple); background:rgba(139,92,246,.06); }
  .cart-count{ background:var(--grad-cta); color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  /* ===== Hero / Banner ===== */
  .hero{ position:relative; overflow:hidden; background:var(--grad-soft); color:var(--text); padding:56px 0 40px; }
  .hero-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; background:rgba(255,255,255,.7); color:var(--purple-deep); border:1px solid rgba(124,58,237,.25); padding:7px 15px; border-radius:999px; margin-bottom:20px; }
  .hero h1{ font-size:clamp(30px,4.6vw,46px); line-height:1.2; max-width:640px; }
  .hero p{ max-width:480px; margin-top:16px; font-size:14.5px; color:var(--text-dim); }
  .hero-cta{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }
  .btn-white{ background:var(--grad-cta); color:#fff; padding:13px 26px; font-size:13.5px; font-weight:700; border-radius:999px; transition:transform .2s; display:inline-block; }
  .btn-white:hover{ transform:translateY(-1px); }
  .btn-outline-white{ border:1.5px solid rgba(124,58,237,.35); color:var(--purple-deep); background:rgba(255,255,255,.6); padding:13px 24px; font-size:13.5px; font-weight:600; border-radius:999px; }

  .highlights{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:36px; }
  .h-card{
    background:#fff; border:1px solid var(--line); box-shadow:0 6px 18px -10px rgba(124,58,237,.25);
    border-radius:var(--radius); padding:16px;
  }
  .h-card .hi{ font-size:20px; margin-bottom:8px; display:block; }
  .h-card .ht{ font-size:12.5px; font-weight:700; color:var(--text); }
  .h-card .hs{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  /* ===== Category + Search section ===== */
  .store-stats-section{ padding:34px 0 6px; }
  .store-stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .store-stat-card{
    position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:20px 22px; min-height:118px;
  }
  .store-stat-label{ font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:10px; }
  .store-stat-value{ font-family:var(--mono); font-size:30px; font-weight:700; color:var(--text); line-height:1; }
  .store-stat-sub{ font-size:12px; color:var(--text-dim); margin-top:6px; }
  .store-stat-icon{ position:absolute; right:14px; top:50%; transform:translateY(-50%); width:56px; height:56px; opacity:.14; background-size:contain; background-repeat:no-repeat; background-position:center; }
  .stat-icon-users{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238B5CF6'><circle cx='8' cy='8' r='3'/><circle cx='16' cy='8' r='3'/><path d='M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/><path d='M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/></svg>"); }
  .stat-icon-products{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2'><path d='M12 3l9 5v8l-9 5-9-5V8z'/><path d='M3 8l9 5 9-5'/><path d='M12 13v8'/></svg>"); }
  .stat-icon-stock{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2'><rect x='3' y='7' width='18' height='13' rx='2'/><path d='M3 11h18'/><path d='M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2'/></svg>"); }
  .stat-icon-sold{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M8 12l3 3 5-6'/></svg>"); }

  .cat-section{ padding:34px 0 4px; }
  .cat-search-bar{ display:flex; gap:10px; margin-bottom:18px; }
  .cat-search-bar input{
    flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 20px;
    font-size:13.5px; background:var(--surface);
  }
  .cat-search-bar input:focus{ border-color:var(--purple); outline:none; }
  .chips{ display:flex; gap:9px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--line); padding:9px 17px; font-size:13px; font-weight:600; border-radius:999px; background:var(--surface); color:var(--text-dim); transition:all .2s; }
  .chip:hover{ border-color:var(--purple); color:var(--text); }
  .chip.active{ background:var(--grad-cta); color:#fff; border-color:transparent; }

  /* ===== Section headers ===== */
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; margin:34px 0 18px; }
  .section-head h2{ font-size:21px; }
  .section-count{ font-size:12.5px; color:var(--text-dim); }

  /* ===== Best seller strip ===== */
  .bs-scroll{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
  .bs-card{
    min-width:190px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; flex-shrink:0; cursor:pointer; transition:border-color .2s, transform .2s;
  }
  .bs-card:hover{ border-color:var(--purple); transform:translateY(-2px); }
  .bs-badge{ display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--coral); padding:3px 8px; border-radius:999px; margin-bottom:8px; }

  /* ===== Product grid & cards ===== */
  .products-section{ padding:8px 0 80px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer;
    transition:border-color .25s, transform .25s, box-shadow .25s;
  }
  .card:hover{ border-color:var(--purple); transform:translateY(-3px); box-shadow:0 16px 32px -22px rgba(139,92,246,.5); }
  .card-top{ display:flex; align-items:center; gap:11px; }
  .badge{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; flex-shrink:0; }
  .badge-netflix{ background:rgba(224,72,62,.13); color:#E0483E; }
  .badge-spotify{ background:rgba(61,163,93,.13); color:#3DA35D; }
  .badge-youtube{ background:rgba(224,72,62,.13); color:#E0483E; }
  .badge-gpt{ background:rgba(139,92,246,.13); color:#8B5CF6; }
  .badge-canva{ background:rgba(236,72,153,.13); color:#EC4899; }
  .badge-capcut{ background:rgba(59,130,246,.13); color:#3B82F6; }
  .badge-vpn{ background:rgba(234,179,8,.15); color:#CA8A04; }
  .badge-ch3{ background:rgba(249,115,22,.13); color:#F97316; }
  .badge-oned{ background:rgba(59,130,246,.13); color:#3B82F6; }
  .badge-viu{ background:rgba(168,85,247,.13); color:#A855F7; }
  .badge-wetv{ background:rgba(34,197,94,.13); color:#16A34A; }
  .badge-prime{ background:rgba(0,168,225,.13); color:#00A8E1; }
  .badge-youku{ background:rgba(220,38,38,.13); color:#DC2626; }
  .badge-bili{ background:rgba(251,114,153,.15); color:#FB7299; }
  .badge-outlook{ background:rgba(0,120,212,.13); color:#0078D4; }
  .badge-hotmail{ background:rgba(0,80,158,.13); color:#00509E; }
  .badge-img{ background-size:cover; background-position:center; background-color:var(--bg-deep); }
  .card-name{ font-size:14.5px; font-weight:700; }
  .card-desc{ font-size:11.5px; color:var(--text-dim); min-height:30px; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .card-price{ font-family:var(--mono); font-size:15.5px; font-weight:600; color:var(--purple-deep); }
  .card-price small{ font-family:'Noto Sans Thai',sans-serif; font-size:10.5px; color:var(--text-dim); font-weight:400; }
  .agent-price{ color:var(--coral); font-weight:700; }
  .orig-price{ font-size:11px; color:var(--text-dim); text-decoration:line-through; font-weight:400; }
  .agent-status-box{ background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:14px 0; }
  .agent-status-title{ font-weight:700; font-size:14px; }
  .agent-status-desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .agent-status-pending{ background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.3); }
  .agent-status-approved{ background:rgba(139,92,246,.08); border-color:rgba(139,92,246,.3); }
  .order-history-list{ max-height:52vh; overflow-y:auto; margin-top:8px; display:flex; flex-direction:column; gap:10px; }
  .order-history-item{ background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .ohi-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .ohi-id{ font-family:var(--mono); font-weight:700; font-size:12.5px; }
  .ohi-date{ font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .ohi-items{ font-size:12px; color:var(--text); margin-bottom:8px; }
  .ohi-bottom{ display:flex; justify-content:space-between; align-items:center; }
  .ohi-total{ font-family:var(--mono); font-weight:700; color:var(--purple-deep); font-size:13.5px; }
  .order-history-empty{ text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px; }
  .agent-banner{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    background:linear-gradient(120deg, rgba(139,92,246,.1), rgba(236,72,153,.08));
    border:1px solid rgba(139,92,246,.25); border-radius:var(--radius); padding:20px 26px; margin-top:24px;
  }
  .agent-banner-title{ font-weight:700; font-size:15px; }
  .agent-banner-desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; max-width:480px; }
  .wallet-btn{ font-size:12px; font-weight:700; color:var(--purple-deep); background:rgba(139,92,246,.1); border:1px solid rgba(139,92,246,.3); padding:8px 12px; border-radius:999px; transition:background .2s; }
  .wallet-btn:hover{ background:rgba(139,92,246,.18); }
  .wallet-balance{ color:var(--purple-deep); font-family:var(--mono); font-weight:700; }
  .topup-amounts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .topup-amount-btn{ border:1.5px solid var(--line); border-radius:10px; padding:12px 6px; font-size:13px; font-weight:700; text-align:center; transition:all .2s; }
  .topup-amount-btn.selected{ border-color:var(--purple); background:rgba(139,92,246,.06); color:var(--purple-deep); }
  .wallet-summary-box{ background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .wallet-summary-label{ font-size:12.5px; color:var(--text-dim); }
  .wallet-summary-value{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--purple-deep); }
  .stock-tag{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .stock-ok{ background:rgba(16,185,129,.12); color:#0B9D6E; }
  .stock-low{ background:rgba(245,158,11,.14); color:#B4790A; }
  .stock-out{ background:rgba(239,68,68,.12); color:#DC2626; }

  /* ===== Product detail view ===== */
  .pd-wrap{ padding:30px 0 90px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:20px; }
  .back-link:hover{ color:var(--purple-deep); }
  .pd-grid{ display:grid; grid-template-columns:.85fr 1.15fr; gap:44px; align-items:flex-start; }
  .pd-media{
    aspect-ratio:1/1; border-radius:20px; background:var(--grad);
    display:flex; align-items:center; justify-content:center; font-size:64px; color:#fff; font-weight:700;
    font-family:'Space Grotesk',sans-serif;
  }
  .pd-tag{ font-size:12px; font-weight:700; color:var(--purple-deep); text-transform:uppercase; letter-spacing:.05em; }
  .pd-title{ font-size:28px; margin-top:8px; }
  .pd-desc{ font-size:14px; color:var(--text-dim); margin-top:12px; max-width:460px; }
  .pd-stock{ margin-top:14px; }
  .pd-section-label{ font-size:12.5px; font-weight:700; margin:22px 0 10px; }
  .plan-options{ display:flex; gap:10px; flex-wrap:wrap; }
  .plan-card{
    border:1.5px solid var(--line); border-radius:12px; padding:14px 18px; min-width:110px; text-align:center;
    transition:border-color .2s, background .2s;
  }
  .plan-card.selected{ border-color:var(--purple); background:rgba(139,92,246,.06); }
  .plan-card .pd-days{ font-size:13px; font-weight:700; }
  .plan-card .pd-day-price{ font-family:var(--mono); font-size:15px; color:var(--purple-deep); margin-top:4px; }
  .qty-select-row{ display:flex; align-items:center; gap:14px; margin-top:20px; }
  .qty-box{ display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .qty-box button{ width:38px; height:38px; font-size:16px; }
  .qty-box button:hover{ background:var(--bg-deep); }
  .qty-box span{ width:40px; text-align:center; font-weight:600; }
  .pd-total{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--purple-deep); margin-top:24px; }
  .pd-actions{ display:flex; gap:12px; margin-top:20px; }

  /* ===== Buttons (generic) ===== */
  .btn-primary{ background:var(--grad-cta); color:#fff; padding:14px 28px; font-size:13.5px; font-weight:700; border-radius:999px; transition:opacity .2s; }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.3); }
  .btn-primary:hover{ opacity:.9; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-secondary{ border:1.5px solid var(--line); color:var(--text); padding:13px 24px; font-size:13.5px; font-weight:600; border-radius:999px; transition:border-color .2s; }
  .btn-secondary:hover{ border-color:var(--purple); }

  /* ===== Highlights / USP row (product list page reuse) ===== */

  /* ===== Cart drawer ===== */
  .overlay{ position:fixed; inset:0; background:rgba(30,20,50,.45); opacity:0; pointer-events:none; transition:opacity .3s; z-index:60; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:#fff; z-index:70; transform:translateX(100%); transition:transform .35s ease; display:flex; flex-direction:column; box-shadow:-20px 0 60px -20px rgba(80,50,140,.3); }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line); }
  .drawer-head h3{ font-size:16.5px; }
  .close-btn{ font-size:22px; line-height:1; padding:4px; color:var(--text-dim); }
  .drawer-items{ flex:1; overflow-y:auto; padding:8px 22px; }
  .empty-cart{ text-align:center; padding:60px 10px; color:var(--text-dim); font-size:13px; }
  .cart-item{ display:flex; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); }
  .cart-item-media{ width:46px; height:46px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; }
  .cart-item-info{ flex:1; display:flex; flex-direction:column; gap:3px; }
  .cart-item-name{ font-size:13px; font-weight:700; }
  .cart-item-plan{ font-size:11px; color:var(--purple-deep); font-family:var(--mono); }
  .cart-item-price{ font-size:12px; color:var(--text-dim); }
  .qty-row{ display:flex; align-items:center; gap:9px; margin-top:4px; }
  .qty-btn{ width:21px; height:21px; border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; }
  .qty-btn:hover{ border-color:var(--purple); color:var(--purple); }

    formData.append('amount', expectedAmount);
    try{
      const res = await fetch(SLIP_VERIFY_ENDPOINT, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if(data && data.success){
        return { ok:true, data: data.data };
      }
      return { ok:false, message: slipOkErrorMessage(data), raw: data };
    } catch(e){
      console.error('Slip verification failed:', e);
      return { ok:false, message: 'เชื่อมต่อระบบตรวจสอบสลิปไม่ได้ กรุณาลองใหม่ หรือติดต่อแอดมิน' };
    }
  }

  function slipOkErrorMessage(data){
    const code = data && data.code;
    const map = {
      1000: 'พารามิเตอร์ไม่ถูกต้อง กรุณาลองใหม่',
      1001: 'ไม่พบไฟล์รูปสลิป กรุณาแนบรูปสลิปอีกครั้ง',
      1002: 'ยอดเงินในสลิปไม่ตรงกับยอดที่ต้องชำระ',
      1003: 'สลิปนี้เคยถูกใช้ยืนยันไปแล้ว',
      1004: 'ไม่พบข้อมูลสลิปนี้ หรือสลิปหมดอายุแล้ว',
      1005: 'บัญชีผู้รับเงินในสลิปไม่ตรงกับบัญชีร้าน',
      1006: 'โควต้าการตรวจสอบสลิปของร้านเต็มแล้ว กรุณาติดต่อแอดมิน',
      1007: 'ไม่พบ QR Code ในรูปสลิป กรุณาถ่าย/แนบรูปสลิปให้ชัดเจน'
    };
    return (map[code]) || (data && data.message) || 'ไม่สามารถตรวจสอบสลิปนี้ได้ กรุณาลองใหม่ หรือติดต่อแอดมิน';
  }

  function resetSlipState(){
    state.slipVerifying = false;
    state.slipVerified = false;
    state.slipVerifyError = null;
    state.slipVerifyData = null;
  }

  function updateCheckoutPaymentArea(){
    const content = document.getElementById('payTabContent');
    if(content) content.innerHTML = payTabContent(cartSubtotal());
    const btn = document.getElementById('confirmPayBtn');
    if(btn){
      const needsSlip = (state.paymentTab === 'qr' || state.paymentTab === 'bank');
      btn.disabled = needsSlip && !state.slipVerified;
      btn.style.opacity = btn.disabled ? '.5' : '1';
    }
  }

  async function handleSlipUpload(file){
    if(!file) return;
    const isTopup = !!document.getElementById('topupPayContent');
    state.slipVerifying = true;
    state.slipVerifyError = null;
    if(isTopup) updateTopupPaymentArea(); else updateCheckoutPaymentArea();
    const amount = isTopup ? state.topupAmount : cartSubtotal();
    const result = await verifySlipWithSlipOk(file, amount);
    state.slipVerifying = false;
    if(result.ok){
      state.slipVerified = true;
      state.slipVerifyData = result.data || {};
      showToast('ตรวจสอบสลิปสำเร็จ ✓');
    } else {
      state.slipVerified = false;
      state.slipVerifyError = result.message;
    }
    if(isTopup) updateTopupPaymentArea(); else updateCheckoutPaymentArea();
  }

  function updateTopupPaymentArea(){
    const content = document.getElementById('topupPayContent');
    if(content) content.innerHTML = topupPayTabContent();
    const btn = document.getElementById('topupConfirmBtn');
    if(btn) btn.disabled = !state.slipVerified;
  }

  async function loadOrCreateCustomerProfile(uid, fallback){
    try{
      const doc = await fbDb.collection('customers').doc(uid).get();
      if(doc.exists){
        return { id: uid, ...doc.data() };
      }
      if(fallback){
        await fbDb.collection('customers').doc(uid).set(fallback);
        return { id: uid, ...fallback };
      }
      return null;
    } catch(e){
      console.error('loadOrCreateCustomerProfile failed:', e);
      return fallback ? { id: uid, ...fallback } : null;
    }
  }

  function upsertLocalCustomer(profile){
    const idx = DB.customers.findIndex(c => c.id === profile.id);
    if(idx >= 0) DB.customers[idx] = profile;
    else DB.customers.push(profile);
  }

  async function loadAllCustomersFromFirestore(){
    if(!firebaseReady || !fbDb) return;
    try{
      const snap = await fbDb.collection('customers').get();
      snap.forEach(doc => upsertLocalCustomer({ id: doc.id, ...doc.data() }));
      state.adminCustomersLoaded = true;
      refreshAdminContent();
    } catch(e){
      console.error('loadAllCustomersFromFirestore failed:', e);
      showToast('โหลดรายชื่อลูกค้าจาก Firebase ไม่สำเร็จ');
    }
  }

  if(firebaseReady){
    fbAuth.onAuthStateChanged(async (user) => {
      if(user){
        const profile = await loadOrCreateCustomerProfile(user.uid, null);
        if(profile){
          upsertLocalCustomer(profile);
          state.currentCustomerId = profile.id;
        }
      } else {
        state.currentCustomerId = null;
      }
      closeModal();
      fullRender();
    });
  }

  function genStockItems(prefix, count){
    const items = [];
    for(let i=0;i<count;i++){
      items.push({
        id: 'si' + (stockItemSeq++),
        email: prefix + (i+1) + '@nextpass-stock.example',
        password: 'Pw' + Math.random().toString(36).slice(2,8),
        note: 'บัญชีสำรอง #' + (i+1),
        variantLabel: null,
        status: 'available',
        orderId: null
      });
    }
    return items;
  }

  function tagStockItemsByVariant(){
    DB.products.forEach(p => {
      const labels = p.variants.map(v => v.label);
      if(labels.length === 0) return;
      p.stockItems.forEach((item, idx) => {
        if(!item.variantLabel) item.variantLabel = labels[idx % labels.length];
      });
    });
  }
